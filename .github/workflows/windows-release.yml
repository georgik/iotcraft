name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (leave empty to use git tag)'
        required: false
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          desktop-client
          iotcraft-mcp-protocol
        key: windows-release-${{ runner.os }}-dist
        cache-on-failure: true

    - name: Build optimized Windows binary
      run: |
        cargo build --profile dist --package iotcraft-dekstop-client --target x86_64-pc-windows-msvc

    - name: Create GitHub Release (if enabled) and upload .exe
      if: github.event.inputs.create_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $releaseName = "${{ github.event.inputs.release_name }}"
        $isPrerelease = "${{ github.event.inputs.prerelease }}" -eq "true"

        if (-not $releaseName) {
          Write-Error "Release name is required when creating a release"
          exit 1
        }

        echo "Checking if release exists: $releaseName"

        # Check if release already exists
        $releaseExists = gh release view "$releaseName" 2>$null
        if ($LASTEXITCODE -eq 0) {
          echo "Release $releaseName already exists, skipping creation"
        } else {
          echo "Creating release: $releaseName (prerelease: $isPrerelease)"

          # Create GitHub release
          gh release create "$releaseName" `
            --title "IoTCraft Windows Release - $releaseName" `
            --notes "Windows x64 release for IoTCraft desktop client.

            **System Requirements:**
            - Windows 11 x64

            **Installation:**
            1. Download iotcraft-dekstop-client.exe
            2. Run the executable directly" `
            --latest `
            $(if ($isPrerelease) { "--prerelease" })

          if ($LASTEXITCODE -eq 0) {
            echo "Release created successfully!"
          } else {
            echo "Failed to create release"
            exit 1
          }
        }

    - name: Upload executable to release
      if: github.event.inputs.create_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $releaseName = "${{ github.event.inputs.release_name }}"

        if (-not $releaseName) {
          Write-Error "Release name is required when uploading to release"
          exit 1
        }

        gh release upload "$releaseName" target\x86_64-pc-windows-msvc\dist\iotcraft-dekstop-client.exe `
          --clobber

    - name: Upload executable as artifact
      uses: actions/upload-artifact@v4
      with:
        name: iotcraft-windows-exe
        path: target/x86_64-pc-windows-msvc/dist/iotcraft-dekstop-client.exe
        retention-days: 30

    - name: Create package with xtask
      run: |
        cargo xtask package --platform windows --profile dist -o dist-package --target x86_64-pc-windows-msvc

    - name: Upload ZIP package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: iotcraft-windows-zip
        path: dist-package/iotcraft-desktop-client-windows-x86_64-pc-windows-msvc.zip
        retention-days: 30

    - name: Upload ZIP package to release
      if: github.event.inputs.create_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $releaseName = "${{ github.event.inputs.release_name }}"

        if (-not $releaseName) {
          Write-Error "Release name is required when uploading to release"
          exit 1
        }

        gh release upload "$releaseName" dist-package/iotcraft-desktop-client-windows-x86_64-pc-windows-msvc.zip `
          --clobber
